name: Update market data snapshot

# 定时生成 data.json 快照：前端直连东方财富失败时（网络受限等）用作兜底。
# 交易日 09:00-15:59 (Asia/Shanghai) 每 10 分钟一次，其余时间不跑；
# 也可以在 Actions 页手动触发（workflow_dispatch）。
on:
  schedule:
    # UTC 01:00-07:59 = 北京时间 09:00-15:59，周一到周五
    - cron: "*/10 1-7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch snapshot
        run: python3 scripts/fetch_snapshot.py data.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
